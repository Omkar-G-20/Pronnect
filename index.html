<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronnect — Discover Teams & Build Projects</title>
  <meta name="description" content="Pronnect is a collaboration platform to discover project teammates, manage tasks, and build open projects.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #030712; color: #f9fafb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
    
    .container { max-width: 1200px; margin: 0 auto; width: 100%; padding: 24px 16px; flex: 1; }
    nav { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 50; padding: 14px 24px; }
    .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .nav-links { display: flex; gap: 8px; align-items: center; }
    
    .glass-card { background: rgba(31, 41, 55, 0.5); border: 1px solid #374151; border-radius: 12px; padding: 20px; }
    .grid { display: grid; gap: 16px; }
    .grid-3 { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
    .grid-kanban { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    
    .gradient-text { background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .text-muted { color: #9ca3af; }
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; background: #1f2937; border: 1px solid #374151; color: #d1d5db; }
    .badge-indigo { background: rgba(99, 102, 241, 0.15); border-color: rgba(99, 102, 241, 0.3); color: #a5b4fc; }
    .badge-green { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.3); color: #86efac; }
    .badge-yellow { background: rgba(234, 179, 8, 0.15); border-color: rgba(234, 179, 8, 0.3); color: #fde047; }
    .badge-red { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #fca5a5; }
    
    input, textarea, select { width: 100%; padding: 10px 14px; background: #111827; border: 1px solid #374151; border-radius: 8px; color: #f9fafb; font-size: 0.875rem; outline: none; transition: border-color 0.2s; }
    input:focus, textarea:focus, select:focus { border-color: #6366f1; }
    button { cursor: pointer; border: none; border-radius: 8px; font-weight: 500; font-size: 0.875rem; transition: all 0.2s; }
    .btn { padding: 8px 16px; }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary { background: #1f2937; color: #e5e7eb; border: 1px solid #374151; }
    .btn-secondary:hover { background: #374151; }
    .btn-sm { padding: 6px 12px; font-size: 0.75rem; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-danger:hover { background: #b91c1c; }
    
    .chat-box { height: 460px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #0b0f19; border-radius: 8px; }
    .msg-bubble { padding: 8px 14px; border-radius: 16px; max-width: 80%; font-size: 0.875rem; }
    .msg-me { align-self: flex-end; background: #6366f1; color: white; border-bottom-right-radius: 2px; }
    .msg-other { align-self: flex-start; background: #1f2937; color: #f3f4f6; border-bottom-left-radius: 2px; }
    
    .progress-track { width: 100%; height: 10px; background: #1f2937; border-radius: 9999px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #22c55e); transition: width 0.4s; }
    
    #toast-root { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { padding: 12px 18px; border-radius: 8px; font-size: 0.875rem; background: #111827; border: 1px solid #6366f1; color: white; box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: auto; }
    .toast-err { border-color: #ef4444; background: #450a0a; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal-content { background: #111827; border: 1px solid #374151; border-radius: 12px; width: 100%; max-width: 440px; padding: 24px; }
  </style>
</head>
<body>
  <!-- NAV (HIDDEN WHEN NOT LOGGED IN) -->
  <nav id="app-nav" style="display:none;">
    <div class="nav-inner">
      <div style="display:flex; align-items:center; gap:20px;">
        <div onclick="navigate('explore')" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <div style="width:32px; height:32px; border-radius:8px; background:#6366f1; display:flex; align-items:center; justify-content:center; font-weight:bold; color:white;">P</div>
          <span class="gradient-text" style="font-size:1.25rem;">Pronnect</span>
        </div>
        <div class="nav-links">
          <button class="btn btn-secondary" onclick="navigate('explore')">Explore</button>
          <button class="btn btn-secondary" onclick="navigate('global-chat')">Global Chat</button>
          <button class="btn btn-secondary" onclick="navigate('new-project')">+ New Project</button>
        </div>
      </div>
      <div id="nav-auth" style="display:flex; align-items:center; gap:12px;"></div>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="container" id="app-root"></div>
  <div id="toast-root"></div>

  <script>
    // --- SHARED REAL-TIME CLOUD STORAGE BRIDGE (FOR MULTI-PROFILE & CROSS-DEVICE SYNC) ---
    const CLOUD_SYNC_ENDPOINT = "https://kvdb.io/A95b1gJtqZ3zH5mK1n9q7W/pronnect_global_state_v1";
    const LOCAL_CACHE_KEY = "pronnect_cached_state_v1";

    let store = {
      users: [],
      projects: [],
      members: [],
      joinRequests: [],
      tasks: [],
      polls: [],
      pollVotes: [],
      messages: [],
      media: []
    };

    let currentUser = null;
    let currentView = 'auth';
    let authMode = 'login'; // 'login' or 'register'
    let activeProjectId = null;
    let activeProjectTab = 'chat';
    let isSyncing = false;
    let domainTags = ["AI/ML", "Web Dev", "Mobile", "Embedded Systems", "Robotics", "IoT", "Cybersecurity", "Data Science", "Research"];

    // Load local cache immediately
    const cached = localStorage.getItem(LOCAL_CACHE_KEY);
    if (cached) {
      try {
        const parsed = JSON.parse(cached);
        if (parsed.store) store = parsed.store;
        if (parsed.currentUser) currentUser = parsed.currentUser;
      } catch (e) {}
    }

    function showToast(msg, isError = false) {
      const root = document.getElementById('toast-root');
      const toast = document.createElement('div');
      toast.className = 'toast ' + (isError ? 'toast-err' : '');
      toast.innerHTML = (isError ? '⚠️ ' : '✅ ') + msg;
      root.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3500);
    }

    // Save and push to cloud
    async function saveState() {
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ store, currentUser }));
      try {
        await fetch(CLOUD_SYNC_ENDPOINT, {
          method: 'POST',
          body: JSON.stringify(store)
        });
      } catch (err) {}
    }

    // Pull from cloud
    async function syncFromCloud() {
      if (isSyncing) return;
      isSyncing = true;
      try {
        const res = await fetch(CLOUD_SYNC_ENDPOINT);
        if (res.ok) {
          const cloudData = await res.json();
          if (cloudData && typeof cloudData === 'object') {
            store = {
              users: cloudData.users || [],
              projects: cloudData.projects || [],
              members: cloudData.members || [],
              joinRequests: cloudData.joinRequests || [],
              tasks: cloudData.tasks || [],
              polls: cloudData.polls || [],
              pollVotes: cloudData.pollVotes || [],
              messages: cloudData.messages || [],
              media: cloudData.media || []
            };
            localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ store, currentUser }));
            
            // Re-render active view
            if (currentView === 'explore') loadProjects();
            if (currentView === 'global-chat') loadGlobalChat();
            if (currentView === 'project' && activeProjectId) {
              if (activeProjectTab === 'chat') loadProjectChat(activeProjectId);
              if (activeProjectTab === 'tasks') loadProjectTasks(activeProjectId);
              if (activeProjectTab === 'polls') loadProjectPolls(activeProjectId);
              if (activeProjectTab === 'media') loadProjectMedia(activeProjectId);
              if (activeProjectTab === 'progress') loadProjectProgress(activeProjectId);
            }
          }
        }
      } catch (e) {}
      finally {
        isSyncing = false;
      }
    }

    // Polling sync every 3 seconds for live multi-profile updates
    setInterval(syncFromCloud, 3000);

    function init() {
      syncFromCloud().then(() => {
        if (!currentUser) {
          renderAuthGate();
        } else {
          document.getElementById('app-nav').style.display = 'block';
          renderNavAuth();
          navigate('explore');
        }
      });
    }

    function renderNavAuth() {
      const container = document.getElementById('nav-auth');
      if (currentUser) {
        container.innerHTML = `
          <button onclick="navigate('profile', '${currentUser.id}')" class="btn btn-secondary" style="display:flex; align-items:center; gap:6px;">
            <div style="width:20px; height:20px; border-radius:50%; background:#6366f1; color:white; font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:bold;">${currentUser.name.slice(0, 1).toUpperCase()}</div>
            <span>${escapeHtml(currentUser.name)}</span>
          </button>
          <button onclick="logout()" class="btn btn-secondary btn-sm" style="color:#ef4444;">Log Out</button>
        `;
      }
    }

    function logout() {
      currentUser = null;
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({ store, currentUser: null }));
      document.getElementById('app-nav').style.display = 'none';
      showToast('Logged out');
      renderAuthGate();
    }

    function navigate(view, param = null) {
      if (!currentUser) {
        renderAuthGate();
        return;
      }
      currentView = view;
      if (view === 'explore') renderExploreView();
      else if (view === 'new-project') renderNewProjectView();
      else if (view === 'project') renderProjectView(param);
      else if (view === 'global-chat') renderGlobalChatView();
      else if (view === 'profile') renderProfileView(param || currentUser.id);
    }

    // --- MANDATORY COMPULSORY LOGIN & SIGNUP SCREEN ---
    function renderAuthGate() {
      currentView = 'auth';
      document.getElementById('app-nav').style.display = 'none';
      const root = document.getElementById('app-root');

      if (authMode === 'login') {
        root.innerHTML = `
          <div style="min-height:75vh; display:flex; align-items:center; justify-content:center;">
            <div class="glass-card" style="width:100%; max-width:420px; display:flex; flex-direction:column; gap:20px;">
              <div style="text-align:center;">
                <div style="width:48px; height:48px; border-radius:12px; background:#6366f1; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:bold; color:white;">P</div>
                <h1 class="gradient-text" style="font-size:1.75rem; margin-bottom:4px;">Pronnect</h1>
                <p class="text-muted text-xs">Enter your credentials to access the platform</p>
              </div>

              <form onsubmit="handleAuthLogin(event)" style="display:flex; flex-direction:column; gap:14px;">
                <div>
                  <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Email or Username</label>
                  <input id="auth-email" required placeholder="name@example.com or handle" />
                </div>
                <div>
                  <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Account Password / PIN</label>
                  <input id="auth-password" type="password" required placeholder="••••••••" />
                </div>
                <button type="submit" class="btn btn-primary" style="padding:12px; margin-top:6px; font-weight:bold;">Sign In &rarr;</button>
              </form>

              <div style="text-align:center; font-size:0.75rem; color:#9ca3af; border-top:1px solid #1f2937; padding-top:12px;">
                New to Pronnect? <button onclick="switchAuthMode('register')" class="btn btn-secondary btn-sm" style="margin-left:6px;">Create Account</button>
              </div>
            </div>
          </div>
        `;
      } else {
        root.innerHTML = `
          <div style="min-height:75vh; display:flex; align-items:center; justify-content:center;">
            <div class="glass-card" style="width:100%; max-width:440px; display:flex; flex-direction:column; gap:20px;">
              <div style="text-align:center;">
                <div style="width:48px; height:48px; border-radius:12px; background:#6366f1; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:bold; color:white;">P</div>
                <h1 class="gradient-text" style="font-size:1.75rem; margin-bottom:4px;">Create Profile</h1>
                <p class="text-muted text-xs">Join collaborators and team up on projects</p>
              </div>

              <form onsubmit="handleAuthRegister(event)" style="display:flex; flex-direction:column; gap:12px;">
                <div>
                  <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Full Name / Display Name</label>
                  <input id="reg-name" required placeholder="e.g. Omkar Gurav" />
                </div>
                <div>
                  <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Email</label>
                  <input id="reg-email" type="email" required placeholder="name@example.com" />
                </div>
                <div>
                  <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">Password / PIN</label>
                  <input id="reg-password" type="password" required placeholder="Create a password" />
                </div>
                <div>
                  <label class="text-xs text-muted" style="display:block; margin-bottom:4px;">College / School / Organization</label>
                  <input id="reg-school" placeholder="e.g. Dayananda Sagar College of Engineering" />
                </div>
                <button type="submit" class="btn btn-primary" style="padding:12px; margin-top:6px; font-weight:bold;">Create Account &rarr;</button>
              </form>

              <div style="text-align:center; font-size:0.75rem; color:#9ca3af; border-top:1px solid #1f2937; padding-top:12px;">
                Already registered? <button onclick="switchAuthMode('login')" class="btn btn-secondary btn-sm" style="margin-left:6px;">Sign In</button>
              </div>
            </div>
          </div>
        `;
      }
    }

    function switchAuthMode(mode) {
      authMode = mode;
      renderAuthGate();
    }

    async function handleAuthLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('auth-email').value.trim().toLowerCase();
      const password = document.getElementById('auth-password').value;

      // Sync latest data before checking
      await syncFromCloud();

      const user = store.users.find(u => 
        (u.email.toLowerCase() === identifier || u.name.toLowerCase() === identifier) && 
        u.password === password
      );

      if (!user) {
        showToast("Invalid credentials. If you haven't registered, click 'Create Account'!", true);
        return;
      }

      currentUser = user;
      document.getElementById('app-nav').style.display = 'block';
      renderNavAuth();
      await saveState();
      showToast("Welcome back, " + user.name + "!");
      navigate('explore');
    }

    async function handleAuthRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const password = document.getElementById('reg-password').value;
      const school = document.getElementById('reg-school').value.trim();

      await syncFromCloud();

      if (store.users.some(u => u.email.toLowerCase() === email)) {
        showToast("An account with this email already exists! Please Sign In.", true);
        return;
      }

      const newUser = {
        id: "u_" + Date.now() + "_" + Math.random().toString(36).substring(2, 6),
        name,
        email,
        password,
        school,
        bio: "",
        skills: [],
        createdAt: new Date().toISOString()
      };

      store.users.push(newUser);
      currentUser = newUser;
      document.getElementById('app-nav').style.display = 'block';
      renderNavAuth();
      await saveState();
      showToast("Account created successfully!");
      navigate('explore');
    }

    // --- 1. EXPLORE PROJECTS ---
    function renderExploreView() {
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="flex justify-between items-center" style="flex-wrap:wrap; gap:12px;">
            <div>
              <h1 style="font-size:1.75rem; font-weight:bold;">Explore Projects</h1>
              <p class="text-muted text-sm">Discover public projects or enter private project passwords to join</p>
            </div>
            <div style="display:flex; gap:8px;">
              <button onclick="promptJoinPrivateProject()" class="btn btn-secondary">🔑 Enter Private Project</button>
              <button onclick="navigate('new-project')" class="btn btn-primary">+ Create Project</button>
            </div>
          </div>

          <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
              <input id="search-input" oninput="loadProjects()" placeholder="Search projects by name..." style="flex:1; min-width:200px;" />
              <input id="school-input" oninput="loadProjects()" placeholder="Filter by school / college..." style="flex:1; min-width:200px;" />
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;" id="tag-filters">
              <button onclick="selectTag('')" id="tag-btn-all" class="badge badge-indigo" style="cursor:pointer; padding:6px 12px;">All Tags</button>
              ${domainTags.map(t => `<button onclick="selectTag('${t}')" id="tag-btn-${t.replace(/[^a-zA-Z]/g, '')}" class="badge" style="cursor:pointer; padding:6px 12px;">${t}</button>`).join('')}
            </div>
          </div>

          <div id="projects-grid" class="grid grid-3"></div>
        </div>
      `;
      loadProjects();
    }

    let activeTag = '';
    function selectTag(tag) {
      activeTag = tag;
      document.querySelectorAll('#tag-filters button').forEach(b => { b.className = 'badge'; });
      const sel = tag ? document.getElementById('tag-btn-' + tag.replace(/[^a-zA-Z]/g, '')) : document.getElementById('tag-btn-all');
      if (sel) sel.className = 'badge badge-indigo';
      loadProjects();
    }

    function loadProjects() {
      const search = document.getElementById('search-input')?.value.toLowerCase() || '';
      const school = document.getElementById('school-input')?.value.toLowerCase() || '';
      
      // Filter projects: Public OR Projects user is a member of
      let list = store.projects.filter(p => 
        p.visibility === 'PUBLIC' || 
        (currentUser && p.leaderId === currentUser.id) ||
        (currentUser && store.members.some(m => m.projectId === p.id && m.userId === currentUser.id))
      );

      if (activeTag) list = list.filter(p => p.tags && p.tags.includes(activeTag));
      if (search) list = list.filter(p => p.name.toLowerCase().includes(search) || p.description.toLowerCase().includes(search));
      if (school) {
        list = list.filter(p => {
          const leader = store.users.find(u => u.id === p.leaderId);
          return leader && leader.school && leader.school.toLowerCase().includes(school);
        });
      }

      const grid = document.getElementById('projects-grid');
      if (!grid) return;

      if (list.length === 0) {
        grid.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#9ca3af;">
            <div style="font-size:2.5rem; margin-bottom:10px;">🚀</div>
            <h3 style="font-size:1.1rem; color:#f3f4f6; margin-bottom:6px;">No projects found</h3>
            <p class="text-muted text-sm" style="margin-bottom:16px;">Create the first project and invite team members across different profiles!</p>
            <button onclick="navigate('new-project')" class="btn btn-primary">+ Create Project</button>
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(p => {
        const leader = store.users.find(u => u.id === p.leaderId);
        const memberCount = store.members.filter(m => m.projectId === p.id).length || 1;
        const isPrivate = p.visibility === 'PRIVATE';

        return `
          <div class="glass-card flex flex-col justify-between" style="cursor:pointer;" onclick="handleProjectCardClick('${p.id}')">
            <div>
              <div class="flex justify-between items-center" style="margin-bottom:8px;">
                <div style="display:flex; align-items:center; gap:6px;">
                  <h3 style="font-size:1.1rem; font-weight:600; color:#f3f4f6;">${escapeHtml(p.name)}</h3>
                  ${isPrivate ? '<span class="badge badge-yellow">🔒 Private</span>' : ''}
                </div>
                <span class="badge">${memberCount} member${memberCount !== 1 ? 's' : ''}</span>
              </div>
              <p class="text-muted text-sm" style="margin-bottom:12px;">${escapeHtml(p.description)}</p>
              <div style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:16px;">
                ${(p.tags || []).map(t => `<span class="badge badge-indigo">${t}</span>`).join('')}
              </div>
            </div>
            <div class="flex justify-between items-center" style="padding-top:10px; border-top:1px solid #1f2937;">
              <div style="font-size:0.75rem; color:#9ca3af;">
                <div>Led by <strong>${leader ? escapeHtml(leader.name) : 'Leader'}</strong></div>
                ${leader && leader.school ? `<div>🎓 ${escapeHtml(leader.school)}</div>` : ''}
              </div>
              <button class="btn btn-secondary btn-sm">${isPrivate ? 'Unlock &rarr;' : 'Open &rarr;'}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleProjectCardClick(projId) {
      const p = store.projects.find(x => x.id === projId);
      if (!p) return;

      const isLeader = currentUser && p.leaderId === currentUser.id;
      const isMember = isLeader || (currentUser && store.members.some(m => m.projectId === p.id && m.userId === currentUser.id));

      if (p.visibility === 'PRIVATE' && !isMember) {
        promptUnlockPrivateProject(projId);
      } else {
        navigate('project', projId);
      }
    }

    // --- PRIVATE PROJECT PASSWORD UNLOCK ---
    function promptJoinPrivateProject() {
      const projNameOrCode = prompt("Enter Project Name or Invite Code:");
      if (!projNameOrCode) return;
      const p = store.projects.find(x => 
        x.name.toLowerCase() === projNameOrCode.trim().toLowerCase() ||
        (x.inviteCode && x.inviteCode.toUpperCase() === projNameOrCode.trim().toUpperCase())
      );
      if (!p) {
        showToast("Project not found. Check the name or code!", true);
        return;
      }
      promptUnlockPrivateProject(p.id);
    }

    function promptUnlockPrivateProject(projId) {
      const p = store.projects.find(x => x.id === projId);
      if (!p) return;

      const enteredPass = prompt(`🔒 Private Project: "${p.name}"\nEnter the Project Password to join:`);
      if (enteredPass === null) return;

      if (enteredPass.trim() === (p.password || "").trim()) {
        // Grant membership
        if (!store.members.some(m => m.projectId === p.id && m.userId === currentUser.id)) {
          store.members.push({ projectId: p.id, userId: currentUser.id });
          saveState();
        }
        showToast("Password verified! Welcome to the team.", false);
        navigate('project', p.id);
      } else {
        showToast("Incorrect project password!", true);
      }
    }

    // --- 2. PROJECT DETAIL & WORKSPACE ---
    function renderProjectView(projectId) {
      activeProjectId = projectId;
      const root = document.getElementById('app-root');
      const project = store.projects.find(p => p.id === projectId);
      if (!project) {
        root.innerHTML = '<div style="text-align:center; padding:60px; color:#ef4444;">Project not found.</div>';
        return;
      }

      const isLeader = currentUser && project.leaderId === currentUser.id;
      const isMember = isLeader || (currentUser && store.members.some(m => m.projectId === project.id && m.userId === currentUser.id));

      if (project.visibility === 'PRIVATE' && !isMember) {
        promptUnlockPrivateProject(projectId);
        return;
      }

      root.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="glass-card flex justify-between items-center" style="flex-wrap:wrap; gap:16px;">
            <div>
              <div style="display:flex; align-items:center; gap:8px;">
                <h1 style="font-size:1.5rem; font-weight:bold;">${escapeHtml(project.name)}</h1>
                <span class="badge ${project.visibility === 'PUBLIC' ? 'badge-green' : 'badge-yellow'}">${project.visibility === 'PUBLIC' ? 'Public' : '🔒 Private'}</span>
              </div>
              <p class="text-muted text-sm" style="margin-top:6px;">${escapeHtml(project.description)}</p>
              <div style="display:flex; gap:6px; margin-top:10px;">
                ${(project.tags || []).map(t => `<span class="badge badge-indigo">${t}</span>`).join('')}
              </div>
            </div>
            <div style="display:flex; gap:8px;">
              ${!isMember && currentUser && project.visibility === 'PUBLIC' ? `<button onclick="requestToJoin('${project.id}')" class="btn btn-primary">Request to Join</button>` : ''}
              ${isLeader && project.visibility === 'PRIVATE' ? `<button onclick="alert('Project Password: ' + '${escapeHtml(project.password || 'None')}')" class="btn btn-secondary btn-sm">🔑 View Password</button>` : ''}
            </div>
          </div>

          <div style="display:flex; gap:8px; border-bottom:1px solid #1f2937; padding-bottom:8px; overflow-x:auto;">
            <button onclick="switchProjectTab('chat')" id="ptab-chat" class="btn btn-primary btn-sm">💬 Team Chat</button>
            <button onclick="switchProjectTab('tasks')" id="ptab-tasks" class="btn btn-secondary btn-sm">📋 Tasks</button>
            <button onclick="switchProjectTab('polls')" id="ptab-polls" class="btn btn-secondary btn-sm">📊 Polls</button>
            <button onclick="switchProjectTab('media')" id="ptab-media" class="btn btn-secondary btn-sm">📁 Media & Links</button>
            <button onclick="switchProjectTab('progress')" id="ptab-progress" class="btn btn-secondary btn-sm">📈 Progress</button>
            ${isLeader ? `<button onclick="switchProjectTab('requests')" id="ptab-requests" class="btn btn-secondary btn-sm">👥 Requests</button>` : ''}
          </div>
          <div id="project-tab-content"></div>
        </div>
      `;

      switchProjectTab(activeProjectTab || 'chat');
    }

    function requestToJoin(projId) {
      if (!currentUser) return;
      const existing = store.joinRequests.find(r => r.projectId === projId && r.userId === currentUser.id);
      if (existing) { showToast("Join request already pending!"); return; }

      store.joinRequests.push({
        id: "jr_" + Date.now(),
        projectId: projId,
        userId: currentUser.id,
        status: "PENDING"
      });
      saveState();
      showToast("Join request sent to project leader!");
      renderProjectView(projId);
    }

    function switchProjectTab(tab) {
      activeProjectTab = tab;
      document.querySelectorAll('[id^="ptab-"]').forEach(b => { b.className = 'btn btn-secondary btn-sm'; });
      const active = document.getElementById('ptab-' + tab);
      if (active) active.className = 'btn btn-primary btn-sm';

      if (tab === 'chat') loadProjectChat(activeProjectId);
      else if (tab === 'tasks') loadProjectTasks(activeProjectId);
      else if (tab === 'polls') loadProjectPolls(activeProjectId);
      else if (tab === 'media') loadProjectMedia(activeProjectId);
      else if (tab === 'progress') loadProjectProgress(activeProjectId);
      else if (tab === 'requests') loadProjectRequests(activeProjectId);
    }

    // --- TEAM CHAT ---
    function loadProjectChat(projId) {
      const container = document.getElementById('project-tab-content');
      if (!container) return;
      container.innerHTML = `
        <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
          <div id="chat-messages" class="chat-box"></div>
          <form onsubmit="sendProjectMessage(event, '${projId}')" style="display:flex; gap:8px;">
            <input id="proj-msg-input" placeholder="Type a message to the team..." style="flex:1;" />
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        </div>
      `;
      const msgs = store.messages.filter(m => m.projectId === projId);
      const box = document.getElementById('chat-messages');
      if (!box) return;
      if (msgs.length === 0) {
        box.innerHTML = '<div style="text-align:center; color:#6b7280; margin:auto;">No messages yet. Start the team discussion! 👋</div>';
        return;
      }
      box.innerHTML = msgs.map(m => {
        const isMe = currentUser && m.senderId === currentUser.id;
        const sender = store.users.find(u => u.id === m.senderId) || { name: 'User' };
        return `
          <div style="display:flex; flex-direction:column; align-items:${isMe ? 'flex-end' : 'flex-start'};">
            <div class="text-muted text-xs" style="margin-bottom:2px;">${escapeHtml(sender.name)}</div>
            <div class="msg-bubble ${isMe ? 'msg-me' : 'msg-other'}">${escapeHtml(m.content)}</div>
          </div>
        `;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    function sendProjectMessage(e, projId) {
      e.preventDefault();
      const input = document.getElementById('proj-msg-input');
      const content = input.value.trim();
      if (!content || !currentUser) return;
      input.value = '';
      store.messages.push({
        id: "msg_" + Date.now(),
        projectId: projId,
        senderId: currentUser.id,
        content: content,
        createdAt: new Date().toISOString()
      });
      saveState();
      loadProjectChat(projId);
    }

    // --- KANBAN TASKS ---
    function loadProjectTasks(projId) {
      const container = document.getElementById('project-tab-content');
      if (!container) return;
      container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="flex justify-between items-center">
            <h3 style="font-weight:600;">Project Tasks</h3>
            <button onclick="showCreateTaskModal('${projId}')" class="btn btn-primary btn-sm">+ Add Task</button>
          </div>
          <div id="tasks-board" class="grid grid-kanban"></div>
        </div>
      `;
      const tasks = store.tasks.filter(t => t.projectId === projId);
      const todo = tasks.filter(t => t.status === 'TODO');
      const inProgress = tasks.filter(t => t.status === 'IN_PROGRESS');
      const done = tasks.filter(t => t.status === 'DONE');

      document.getElementById('tasks-board').innerHTML = `
        ${renderTaskCol('To Do', todo, 'TODO', projId)}
        ${renderTaskCol('In Progress', inProgress, 'IN_PROGRESS', projId)}
        ${renderTaskCol('Done', done, 'DONE', projId)}
      `;
    }

    function renderTaskCol(title, list, status, projId) {
      return `
        <div class="glass-card" style="display:flex; flex-direction:column; gap:10px;">
          <div class="flex justify-between items-center text-xs" style="font-weight:bold; color:#9ca3af; text-transform:uppercase;">
            <span>${title}</span>
            <span class="badge">${list.length}</span>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${list.length === 0 ? '<div class="text-muted text-xs" style="text-align:center; padding:12px;">No tasks</div>' : ''}
            ${list.map(t => {
              const assignee = store.users.find(u => u.id === t.assigneeId);
              return `
                <div style="background:#111827; border:1px solid #1f2937; border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:6px;">
                  <div style="font-size:0.875rem; font-weight:500;">${escapeHtml(t.title)}</div>
                  ${t.description ? `<div class="text-muted text-xs">${escapeHtml(t.description)}</div>` : ''}
                  <div class="flex justify-between items-center text-xs" style="margin-top:4px;">
                    <span class="text-muted">${assignee ? '👤 ' + escapeHtml(assignee.name) : 'Unassigned'}</span>
                    <select onchange="updateTaskStatus('${t.id}', this.value, '${projId}')" style="width:auto; padding:2px 6px; font-size:10px;">
                      <option value="TODO" ${t.status === 'TODO' ? 'selected' : ''}>To Do</option>
                      <option value="IN_PROGRESS" ${t.status === 'IN_PROGRESS' ? 'selected' : ''}>In Progress</option>
                      <option value="DONE" ${t.status === 'DONE' ? 'selected' : ''}>Done</option>
                    </select>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function updateTaskStatus(taskId, status, projId) {
      const t = store.tasks.find(x => x.id === taskId);
      if (t) { t.status = status; saveState(); }
      loadProjectTasks(projId);
    }

    function showCreateTaskModal(projId) {
      const title = prompt("Task title:");
      if (!title) return;
      const description = prompt("Task description (optional):") || "";
      store.tasks.push({
        id: "t_" + Date.now(),
        projectId: projId,
        title,
        description,
        status: "TODO",
        assigneeId: currentUser ? currentUser.id : null
      });
      saveState();
      loadProjectTasks(projId);
    }

    // --- POLLS ---
    function loadProjectPolls(projId) {
      const container = document.getElementById('project-tab-content');
      if (!container) return;
      container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="flex justify-between items-center">
            <h3 style="font-weight:600;">Team Polls</h3>
            <button onclick="showCreatePollModal('${projId}')" class="btn btn-primary btn-sm">+ Create Poll</button>
          </div>
          <div id="polls-list" style="display:flex; flex-direction:column; gap:12px;"></div>
        </div>
      `;
      const polls = store.polls.filter(p => p.projectId === projId);
      const box = document.getElementById('polls-list');
      if (polls.length === 0) {
        box.innerHTML = '<div class="glass-card" style="text-align:center; padding:30px; color:#6b7280;">No polls created yet.</div>';
        return;
      }
      box.innerHTML = polls.map(p => {
        const votes = store.pollVotes.filter(v => v.pollId === p.id);
        const totalVotes = votes.length;
        const userVote = currentUser ? votes.find(v => v.userId === currentUser.id)?.optionIndex : null;

        return `
          <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
            <div style="font-size:1rem; font-weight:600;">${escapeHtml(p.question)}</div>
            <div class="text-muted text-xs">${totalVotes} voter${totalVotes !== 1 ? 's' : ''}</div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${p.options.map((opt, idx) => {
                const count = votes.filter(v => v.optionIndex === idx).length;
                const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                const hasVoted = userVote === idx;
                return `
                  <button onclick="votePoll('${p.id}', ${idx}, '${projId}')" class="btn btn-secondary flex justify-between items-center" style="text-align:left; padding:10px 14px; position:relative; overflow:hidden;">
                    <div style="position:absolute; top:0; left:0; bottom:0; width:${pct}%; background:rgba(99, 102, 241, 0.2);"></div>
                    <span style="position:relative; z-index:2;">${escapeHtml(opt)} ${hasVoted ? '✓' : ''}</span>
                    <span class="text-muted text-xs" style="position:relative; z-index:2;">${count} votes (${pct}%)</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function votePoll(pollId, idx, projId) {
      if (!currentUser) return;
      const existing = store.pollVotes.find(v => v.pollId === pollId && v.userId === currentUser.id);
      if (existing) { existing.optionIndex = idx; }
      else { store.pollVotes.push({ pollId, userId: currentUser.id, optionIndex: idx }); }
      saveState();
      loadProjectPolls(projId);
    }

    function showCreatePollModal(projId) {
      const question = prompt("Poll question:");
      if (!question) return;
      const opt1 = prompt("Option 1:");
      const opt2 = prompt("Option 2:");
      if (!opt1 || !opt2) return;
      store.polls.push({
        id: "poll_" + Date.now(),
        projectId: projId,
        question,
        options: [opt1, opt2]
      });
      saveState();
      loadProjectPolls(projId);
    }

    // --- MEDIA ---
    function loadProjectMedia(projId) {
      const container = document.getElementById('project-tab-content');
      if (!container) return;
      container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="flex justify-between items-center">
            <h3 style="font-weight:600;">Media & Resources</h3>
            <button onclick="showAddMediaModal('${projId}')" class="btn btn-primary btn-sm">+ Add Resource</button>
          </div>
          <div id="media-grid" class="grid grid-3"></div>
        </div>
      `;
      const items = store.media.filter(m => m.projectId === projId);
      const grid = document.getElementById('media-grid');
      if (items.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px; color:#6b7280;">No resources shared yet.</div>';
        return;
      }
      grid.innerHTML = items.map(m => `
        <a href="${escapeHtml(m.url)}" target="_blank" class="glass-card" style="text-decoration:none; color:inherit; display:flex; gap:12px; align-items:flex-start;">
          <div style="font-size:1.5rem;">🔗</div>
          <div style="overflow:hidden;">
            <div style="font-weight:500; font-size:0.875rem; color:#f3f4f6;">${escapeHtml(m.name)}</div>
            <div class="text-muted text-xs" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(m.url)}</div>
          </div>
        </a>
      `).join('');
    }

    function showAddMediaModal(projId) {
      const name = prompt("Resource name:");
      const url = prompt("Resource URL (https://...):");
      if (!url) return;
      store.media.push({
        id: "med_" + Date.now(),
        projectId: projId,
        name: name || url,
        url
      });
      saveState();
      loadProjectMedia(projId);
    }

    // --- PROGRESS ---
    function loadProjectProgress(projId) {
      const container = document.getElementById('project-tab-content');
      if (!container) return;
      const tasks = store.tasks.filter(t => t.projectId === projId);
      const total = tasks.length;
      const done = tasks.filter(t => t.status === 'DONE').length;
      const inProgress = tasks.filter(t => t.status === 'IN_PROGRESS').length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      container.innerHTML = `
        <div class="glass-card" style="display:flex; flex-direction:column; gap:20px;">
          <h3 style="font-weight:600;">Milestone & Progress Overview</h3>
          <div class="grid grid-3">
            <div class="glass-card" style="text-align:center; background:#111827;">
              <div style="font-size:1.75rem; font-weight:bold;">${total}</div>
              <div class="text-muted text-xs">Total Tasks</div>
            </div>
            <div class="glass-card" style="text-align:center; background:#111827;">
              <div style="font-size:1.75rem; font-weight:bold; color:#eab308;">${inProgress}</div>
              <div class="text-muted text-xs">In Progress</div>
            </div>
            <div class="glass-card" style="text-align:center; background:#111827;">
              <div style="font-size:1.75rem; font-weight:bold; color:#22c55e;">${done}</div>
              <div class="text-muted text-xs">Completed</div>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <div class="flex justify-between text-xs" style="font-weight:500;">
              <span>Overall Completion</span>
              <span>${pct}%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%;"></div>
            </div>
          </div>
        </div>
      `;
    }

    // --- JOIN REQUESTS ---
    function loadProjectRequests(projId) {
      const container = document.getElementById('project-tab-content');
      if (!container) return;
      const requests = store.joinRequests.filter(r => r.projectId === projId && r.status === 'PENDING');
      container.innerHTML = `
        <div class="glass-card" style="display:flex; flex-direction:column; gap:16px;">
          <h3 style="font-weight:600;">Pending Join Requests (${requests.length})</h3>
          ${requests.length === 0 ? '<div class="text-muted text-sm" style="text-align:center; padding:20px;">No pending join requests</div>' : ''}
          <div style="display:flex; flex-direction:column; gap:10px;">
            ${requests.map(r => {
              const u = store.users.find(x => x.id === r.userId) || { name: 'User' };
              return `
                <div class="flex justify-between items-center" style="background:#111827; padding:12px 16px; border-radius:8px; border:1px solid #1f2937;">
                  <div>
                    <div style="font-weight:500;">${escapeHtml(u.name)}</div>
                    <div class="text-muted text-xs">${escapeHtml(u.school || '')}</div>
                  </div>
                  <div style="display:flex; gap:8px;">
                    <button onclick="handleJoinRequest('${r.id}', 'DENIED', '${projId}')" class="btn btn-secondary btn-sm" style="color:#ef4444;">Deny</button>
                    <button onclick="handleJoinRequest('${r.id}', 'APPROVED', '${projId}')" class="btn btn-primary btn-sm" style="background:#16a34a;">Approve</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function handleJoinRequest(reqId, action, projId) {
      const r = store.joinRequests.find(x => x.id === reqId);
      if (r) {
        r.status = action;
        if (action === 'APPROVED') {
          store.members.push({ projectId: projId, userId: r.userId });
        }
        saveState();
      }
      showToast(action === 'APPROVED' ? 'Member approved!' : 'Denied');
      loadProjectRequests(projId);
    }

    // --- CREATE NEW PROJECT (WITH PRIVATE PASSWORD SUPPORT) ---
    function renderNewProjectView() {
      if (!currentUser) { renderAuthGate(); return; }
      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="glass-card" style="max-width:600px; margin:0 auto; display:flex; flex-direction:column; gap:16px;">

              <select id="new-proj-vis" onchange="togglePrivatePasswordInput(this.value)">
                <option value="PUBLIC">Public (Visible to everyone in Explore)</option>
                <option value="PRIVATE">🔒 Private (Protected with Project Password)</option>
              </select>
            </div>

              <label class="text-xs" style="color:#a5b4fc; font-weight:bold; margin-bottom:4px; display:block;">🔑 Set Private Project Password</label>
              <input id="new-proj-pass" placeholder="Enter password to restrict member access" />
              <p class="text-muted text-xs" style="margin-top:4px;">Members must enter this password to join and view this project.</p>

            <div>
              <label class="text-xs text-muted" style="margin-bottom:4px; display:block;">Domain Tags (Click to select)</label>
              <div style="display:flex; flex-wrap:wrap; gap:6px;">
                ${domainTags.map(t => `<button type="button" onclick="toggleTag('${t}', this)" class="badge" style="cursor:pointer; padding:6px 10px;">${t}</button>`).join('')}
              </div>
            </div>
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button type="button" onclick="navigate('explore')" class="btn btn-secondary">Cancel</button>
              <button type="submit" class="btn btn-primary" style="flex:1;">Create Project</button>
            </div>
          </form>
        </div>
      `;
    }

    function togglePrivatePasswordInput(vis) {
      const box = document.getElementById('private-password-box');
      if (vis === 'PRIVATE') {
        box.style.display = 'block';
        document.getElementById('new-proj-pass').required = true;
      } else {
        box.style.display = 'none';
        document.getElementById('new-proj-pass').required = false;
      }
    }

    let selectedTags = [];
    function toggleTag(t, btn) {
      if (selectedTags.includes(t)) {
        selectedTags = selectedTags.filter(x => x !== t);
        btn.className = 'badge';
      } else {
        selectedTags.push(t);
        btn.className = 'badge badge-indigo';
      }
    }

    async function submitNewProject(e) {
      e.preventDefault();
      const name = document.getElementById('new-proj-name').value.trim();
      const description = document.getElementById('new-proj-desc').value.trim();
      const visibility = document.getElementById('new-proj-vis').value;
      const password = visibility === 'PRIVATE' ? document.getElementById('new-proj-pass').value.trim() : "";

      const newProj = {
        id: "p_" + Date.now() + "_" + Math.random().toString(36).substring(2, 6),
        name,
        description,
        visibility,
        password,
        inviteCode: Math.random().toString(36).substring(2, 8).toUpperCase(),
        tags: selectedTags,
        leaderId: currentUser.id,
        createdAt: new Date().toISOString()
      };

      store.projects.unshift(newProj);
      store.members.push({ projectId: newProj.id, userId: currentUser.id });
      await saveState();
      selectedTags = [];
      showToast('Project created & synced live!');
      navigate('project', newProj.id);
    }

      root.innerHTML = `

          <div class="flex justify-between items-center">
            <div>
              <h1 style="font-size:1.5rem; font-weight:bold;">Global Community Chat</h1>
              <p class="text-muted text-xs">Live platform-wide chat for all profiles</p>
            </div>
            <span class="badge badge-green">Live Cloud Sync</span>
          </div>
          <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
            <div id="global-chat-messages" class="chat-box"></div>
            <form onsubmit="sendGlobalMessage(event)" style="display:flex; gap:8px;">
              <input id="global-msg-input" placeholder="Type a message to the community..." style="flex:1;" />
              <button type="submit" class="btn btn-primary">Send</button>
            </form>
          </div>
        </div>
      `;
      loadGlobalChat();
    }

    function loadGlobalChat() {
      const msgs = store.messages.filter(m => !m.projectId);
      const box = document.getElementById('global-chat-messages');
      if (!box) return;
      if (msgs.length === 0) {
        box.innerHTML = '<div style="text-align:center; color:#6b7280; margin:auto;">No messages yet. Be the first to say hello to everyone! 🌐</div>';
        return;
      }
      box.innerHTML = msgs.map(m => {
        const isMe = currentUser && m.senderId === currentUser.id;
        const sender = store.users.find(u => u.id === m.senderId) || { name: 'User' };
        return `
          <div style="display:flex; flex-direction:column; align-items:${isMe ? 'flex-end' : 'flex-start'};">
            <div class="text-muted text-xs" style="margin-bottom:2px;">${escapeHtml(sender.name)}</div>
            <div class="msg-bubble ${isMe ? 'msg-me' : 'msg-other'}">${escapeHtml(m.content)}</div>
          </div>
        `;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function sendGlobalMessage(e) {
      e.preventDefault();
      if (!currentUser) return;
      const input = document.getElementById('global-msg-input');
      const content = input.value.trim();
      if (!content) return;
      input.value = '';
      store.messages.push({
        id: "msg_" + Date.now(),
        projectId: null,
        senderId: currentUser.id,
        content: content,
        createdAt: new Date().toISOString()
      });
      await saveState();
      loadGlobalChat();
    }

    // --- PROFILE VIEW ---
    function renderProfileView(userId) {
      const root = document.getElementById('app-root');
      const user = store.users.find(u => u.id === userId) || currentUser;
      if (!user) { root.innerHTML = '<div style="text-align:center; padding:40px;">User not found</div>'; return; }
      const isMe = currentUser && currentUser.id === user.id;
      const userProjects = store.projects.filter(p => p.leaderId === user.id);

      root.innerHTML = `
        <div style="max-width:700px; margin:0 auto; display:flex; flex-direction:column; gap:20px;">
          <div class="glass-card" style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div style="display:flex; gap:16px; align-items:center;">
              <div style="width:56px; height:56px; border-radius:12px; background:#6366f1; font-size:1.5rem; font-weight:bold; color:white; display:flex; align-items:center; justify-content:center;">${user.name.slice(0, 1).toUpperCase()}</div>
              <div>
                <h1 style="font-size:1.5rem; font-weight:bold;">${escapeHtml(user.name)}</h1>
                ${user.school ? `<div class="text-muted text-sm">🎓 ${escapeHtml(user.school)}</div>` : ''}
              </div>
            </div>
            ${isMe ? `<button onclick="editProfile()" class="btn btn-secondary btn-sm">Edit</button>` : ''}
          </div>
          <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
            <h3 style="font-weight:600;">Projects Led (${userProjects.length})</h3>
            <div class="grid" style="grid-template-columns:1fr;">
              ${userProjects.length > 0 ? userProjects.map(p => `
                <div onclick="navigate('project', '${p.id}')" style="background:#111827; padding:12px; border-radius:8px; cursor:pointer;">
                  <div style="font-weight:500;">${escapeHtml(p.name)}</div>
                  <div class="text-muted text-xs">${escapeHtml(p.description)}</div>
                </div>
              `).join('') : '<div class="text-muted text-xs">No projects created yet.</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function editProfile() {
      const bio = prompt("Update bio:", currentUser.bio || "");
      if (bio === null) return;
      const school = prompt("Update school:", currentUser.school || "");
      currentUser.bio = bio;
      currentUser.school = school;
      const u = store.users.find(x => x.id === currentUser.id);
      if (u) { u.bio = bio; u.school = school; }
      saveState();
      renderProfileView(currentUser.id);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    init();
  </script>
</body>
</html>
